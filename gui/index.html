<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>東進 PDF 整理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<main><header><div class="eyebrow">個人学習用ツール</div><h1>東進 PDF 整理</h1><p>取得する問題を選ぶと、2-in-1に変換して保存します。</p></header>
<section class="card"><h2><span>1</span> POSを開く</h2><p>別の「東進学力POS」タブでログインしてください。大問別は科目と分野を開き、問題一覧を表示します。</p><div class="actions"><button id="year">年度別を読み込む</button><button id="daimon" class="secondary">大問別を読み込む</button></div><p id="status" class="status" role="status">準備中…</p></section>
<section class="card" id="selection" hidden><div class="section-head"><div><h2><span>2</span> 取得対象を選ぶ</h2><p id="category"></p></div><div id="count" class="count"></div></div><label id="subject-row" hidden>科目名 <input id="subject" type="text" maxlength="80" placeholder="例：国語"><small>科目を判別できなかった場合のみ入力してください。</small></label><div class="toolbar"><label class="checkall"><input id="all" type="checkbox"> 表示中をすべて選択</label><label class="search">絞り込み <input id="filter" type="search" placeholder="年度・科目・問題名"></label></div><div id="items" class="items"></div><div class="footer"><span id="selected">0件を選択中</span><button id="start" disabled>選択した問題を取得</button></div></section>
<section class="card" id="results" hidden><h2><span>3</span> 取得状況</h2><p id="counts" class="counts"></p><ol id="progress" class="progress"></ol><p class="path">保存先: <code id="path"></code></p></section>
<section class="card" id="rename-section"><h2>演習日をファイル名に付ける</h2><p>保存済みのPDFを選び、指定した日付をファイル名の先頭に付けます。</p><button id="load-files" class="secondary">保存済みPDFを読み込む</button><div id="rename-panel" hidden><div class="toolbar"><label>演習日 <input id="rename-date" type="date"></label><label class="search">絞り込み <input id="rename-filter" type="search" placeholder="ファイル名・フォルダ名"></label></div><label class="checkall"><input id="rename-all" type="checkbox"> 表示中の保存済みPDFをすべて選択</label><div id="saved-files" class="items saved-items"></div><p id="rename-preview" class="preview"></p><div class="footer"><span id="rename-selected">0件を選択中</span><button id="rename-start" disabled>日付を付ける</button></div></div><p id="rename-status" class="status" role="status"></p><ul id="rename-results" class="progress"></ul></section>
<footer>問題PDFとログイン情報はこの端末内で管理してください。</footer></main></body></html>
